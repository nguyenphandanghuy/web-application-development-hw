<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Resilient Event Hub"
    >

    <title>Resilient Event Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <header>
            <p>HW3: Resilient Event Hub</p>

            <h1>Resilient Event Hub</h1>

            <p>
                A resilient landing page with a
                drift-free UTC countdown.
            </p>
        </header>


        <!-- SLICE 1 -->
        <section
            id="countdown-section"
            aria-labelledby="countdown-title"
        >

            <h2 id="countdown-title">
                Event Countdown
            </h2>

            <p>
                Event time:
                <time id="event-time"></time>
            </p>

            <p
                id="countdown"
                aria-live="polite"
            >
                Loading countdown...
            </p>

        </section>


        <!-- SLICE 2 -->
        <section
            id="form-section"
            aria-labelledby="form-title"
        >

            <h2 id="form-title">
                Event Registration
            </h2>

            <form id="event-form">

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    required
                    maxlength="50"
                >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    maxlength="100"
                >

                <button
                    id="submit-button"
                    type="submit"
                >
                    Register
                </button>

            </form>

            <p
                id="form-status"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
